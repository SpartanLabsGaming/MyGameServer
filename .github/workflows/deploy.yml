name: Build and deploy

# Builds MyGameServer on every push to master, runs the test suite, and — only if
# that passes — ships the `installDist` output to the Google Cloud VM over SSH and
# restarts the systemd service. See deploy/README.md for the VM-side setup this
# assumes is already in place.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  # Never let two deploys race onto the box; a newer push supersedes an in-flight one.
  group: deploy-master
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test, and stage the distribution
        run: ./gradlew --no-daemon build installDist

      # build/install/MyGameServer/ now holds bin/ (launcher scripts) + lib/ (all jars).
      # That whole tree is what gets synced to the VM.

      - name: Deploy to the VM
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_HOST:-}" ]; then
            echo "::error::DEPLOY_HOST secret is not set — see deploy/README.md step 3. Build succeeded; skipping deploy."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Trust on first use; the host is a fixed reserved IP we control.
          ssh-keyscan -T 15 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          # Sync the fresh build into the app directory the service runs from.
          # --delete so removed jars don't linger; the service dir is owned by
          # $DEPLOY_USER:mygameserver (see deploy/provision-vm.sh).
          rsync -az --delete --rsh="$SSH" \
            build/install/MyGameServer/ \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/mygameserver/app/"

          # Restart via the one command provision-vm.sh grants this user through sudo.
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'sudo systemctl restart mygameserver'

          # Give it a moment to come up, then fail the job if it isn't running.
          sleep 5
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'systemctl is-active --quiet mygameserver' \
            || { echo "::error::mygameserver is not active after restart"; \
                 $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'sudo systemctl status mygameserver --no-pager -l | tail -n 40'; \
                 exit 1; }

          echo "Deployed and running."
